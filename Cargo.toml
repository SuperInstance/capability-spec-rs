[package]
rust-version = "1.70"
name = "capability-spec"
version = "0.2.0"
edition = "2021"
description = "Capability specification parser with semver, dependency graphs, and scoring — Rust port of capability-spec"
license = "MIT"
keywords = ["capability", "semver", "dependency", "toml", "specification"]
categories = ["config", "parser-implementations"]
repository = "https://github.com/SuperInstance/capability-spec-rs"
documentation = "https://docs.rs/capability-spec-rs"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
